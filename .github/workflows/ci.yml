name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # mongodb-memory-server downloads a MongoDB binary on first run; keep it between runs.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}
      - run: npm ci
      - run: npm test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose up -d
      - name: Wait for the API through nginx
        run: |
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/v1/health | grep -q '"database":"up"'; then
              echo "healthy"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy"
          exit 1
      - name: Serve the app
        run: |
          curl -sf http://localhost:8080/ | grep -q '<div id="root">'
          curl -sf -o /dev/null http://localhost:8080/recipes/new
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - run: docker compose down -v
        if: always()
