services:
  mongo:
    image: mongo:8
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    image: ${DOCKERHUB_USER:-local}/recipe-sharing-backend:latest
    environment:
      PORT: 3001
      # Defaults to the local mongo service; set DATABASE_URL in .env to use Atlas.
      DATABASE_URL: ${DATABASE_URL:-mongodb://mongo:27017/recipe-sharing}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
    ports:
      - '3001:3001'
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    image: ${DOCKERHUB_USER:-local}/recipe-sharing-frontend:latest
    ports:
      - '8080:80'
    depends_on:
      - backend

volumes:
  mongo-data:
